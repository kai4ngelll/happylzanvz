<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Лиза</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071a34;
    --bg-line:rgba(180,205,240,0.16);
    --text:#e2edfa;
    --muted:#6f8bb8;
    --ice:#8fd3f4;
    --peri:#a9bdf5;
    --gold:#e8c98a;
    --pink:#e79fc4;
    --violet:#a692e0;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
  }

  ::selection{ background:var(--ice); color:#04101f; }

  body{ position:relative; width:100%; min-height:100vh; }

  .sky{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, rgba(143,211,244,0.22), transparent 62%),
      radial-gradient(ellipse 70% 50% at 90% 100%, rgba(143,211,244,0.12), transparent 60%),
      radial-gradient(ellipse 70% 50% at 5% 90%, rgba(169,189,245,0.10), transparent 60%),
      linear-gradient(180deg, #0a2140 0%, #071a34 45%, #051327 100%);
    z-index:0;
  }

  .stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .stars span{
    position:absolute;
    width:1.5px; height:1.5px;
    background:var(--peri);
    border-radius:50%;
    opacity:0.35;
    animation:twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.1;}
    50%{opacity:0.55;}
  }

  .fireworks-bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .firework{
    position:absolute;
    animation:fw-pulse 6s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes fw-pulse{
    0%,100%{ opacity:0.3; transform:scale(0.92); }
    50%{ opacity:0.75; transform:scale(1.04); }
  }

  .mono{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.14em;
    text-transform:lowercase;
  }

  .screen{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    visibility:hidden;
    transition:opacity 0.7s ease;
  }
  .screen.active{ opacity:1; visibility:visible; pointer-events:auto; }
  .screen:not(.active){ pointer-events:none; }

  /* ---------- Question screen ---------- */
  .frame{
    position:relative;
    width:100%;
    max-width:380px;
    text-align:center;
    padding:44px 8px;
  }
  .rule{
    width:34px;
    height:1px;
    background:var(--bg-line);
    margin:0 auto;
  }
  .rule.top{ margin-bottom:26px; }
  .rule.bottom{ margin-top:30px; }

  .question{
    font-weight:500;
    font-size:clamp(24px, 5.6vw, 32px);
    line-height:1.35;
    color:var(--text);
  }
  .question em{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    color:var(--ice);
  }

  .btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:34px;
  }

  button{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:lowercase;
    border-radius:3px;
    padding:12px 30px;
    cursor:pointer;
    background:transparent;
    border:1px solid var(--bg-line);
    color:var(--muted);
    transition:border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
  }
  button:hover{ color:var(--text); border-color:var(--ice); }
  button:active{ transform:scale(0.97); }
  button:focus-visible{ outline:1px solid var(--ice); outline-offset:3px; }

  .btn-yes{ color:var(--ice); border-color:rgba(143,211,244,0.4); }
  .btn-yes:hover{ background:rgba(143,211,244,0.08); border-color:var(--ice); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(4,9,20,0.82);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    opacity:0; visibility:hidden;
    transition:opacity 0.3s ease;
    padding:24px;
  }
  .modal-overlay.active{ opacity:1; visibility:visible; }

  .modal{
    background:var(--bg);
    border:1px solid var(--bg-line);
    border-radius:4px;
    padding:32px 28px;
    max-width:300px;
    width:100%;
    text-align:center;
  }
  .modal p{
    font-size:14px;
    line-height:1.65;
    color:var(--muted);
    margin-bottom:22px;
  }
  .btn-reload{ width:100%; color:var(--text); border-color:var(--bg-line); }
  .btn-reload:hover{ border-color:var(--peri); color:var(--peri); }

  /* ---------- Balloons screen ---------- */
  #screen-balloons{ overflow:hidden; }

  .balloon{
    position:absolute;
    bottom:-140px;
    border-radius:50%;
    opacity:0.92;
    box-shadow:inset -6px -8px 14px rgba(0,0,0,0.2), inset 5px 6px 10px rgba(255,255,255,0.22);
  }
  .balloon::after{
    content:"";
    position:absolute;
    bottom:-30px; left:50%;
    width:1px; height:32px;
    background:rgba(255,255,255,0.2);
    transform:translateX(-50%);
  }
  .balloon::before{
    content:"";
    position:absolute;
    top:16%; left:24%;
    width:22%; height:18%;
    background:rgba(255,255,255,0.4);
    border-radius:50%;
    filter:blur(1px);
  }

  @keyframes rise{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); }
    100%{ transform:translateY(-125vh) translateX(var(--drift, 20px)) rotate(var(--rot, 6deg)); }
  }

  /* ---------- Birthday screen ---------- */
  #screen-birthday .frame{ max-width:640px; }

  .headline{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(38px, 8vw, 64px);
    line-height:1.3;
    letter-spacing:0.01em;
    background:linear-gradient(135deg, #ffffff 0%, var(--ice) 55%, var(--peri) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(143,211,244,0.25);
    animation:appear 1.1s ease both;
  }
  .headline .accent{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:1em;
    background:linear-gradient(135deg, var(--ice), #ffffff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  @keyframes appear{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .float-balloon{
    position:absolute;
    border-radius:50%;
    animation:driftSlow 9s ease-in-out infinite;
    opacity:0.75;
  }
  @keyframes driftSlow{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-20px); }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }

  @media (max-width:420px){
    .btn-row{ flex-direction:column; align-items:center; }
    button{ width:100%; max-width:220px; }
  }

  /* ---------- Vines (hairline, minimal) ---------- */
  .vine{
    position:fixed;
    top:0;
    height:100vh;
    width:min(14vw, 170px);
    z-index:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 1s ease 0.2s;
  }
  .vine-left{ left:0; }
  .vine-right{ right:0; transform:scaleX(-1); }
  #screen-question.active .vine{ opacity:0.6; }

  @media (max-width:860px){
    .vine{ width:min(9vw, 80px); }
    #screen-question.active .vine{ opacity:0.35; }
  }
  @media (max-width:600px){
    .vine{ display:none; }
  }

  /* ---------- Letters section ---------- */
  .letters-wrap{
    margin-top:52px;
    opacity:0;
    animation:appear 1.1s ease 0.4s both;
  }
  .letters-label{
    font-size:11px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .letters-grid{
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .envelope{
    position:relative;
    width:148px;
    height:104px;
    background:linear-gradient(160deg, rgba(143,211,244,0.07), rgba(169,189,245,0.03));
    border:1px solid var(--bg-line);
    border-radius:5px;
    cursor:pointer;
    overflow:hidden;
    transition:border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    perspective:400px;
  }
  .envelope:hover{
    border-color:var(--ice);
    transform:translateY(-3px);
    box-shadow:0 10px 26px rgba(4,12,26,0.4);
  }
  .envelope:active{ transform:translateY(-1px) scale(0.98); }

  .envelope .flap{
    position:absolute;
    top:0; left:0; right:0;
    height:56px;
    background:linear-gradient(150deg, rgba(143,211,244,0.14), rgba(169,189,245,0.05));
    clip-path:polygon(0 0, 100% 0, 50% 68%);
    transform-origin:top center;
    transition:transform 0.4s ease;
    border-bottom:1px solid var(--bg-line);
  }
  .envelope:hover .flap{ transform:rotateX(-18deg); }

  .envelope .seal{
    position:absolute;
    top:38px; left:50%;
    transform:translate(-50%,-50%);
    width:20px; height:20px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold), #b8935a 75%);
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    z-index:2;
  }

  .envelope .name{
    position:absolute;
    bottom:14px; left:0; right:0;
    text-align:center;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-size:17px;
    color:var(--text);
  }
  .envelope .hint{
    position:absolute;
    bottom:0; left:0; right:0;
    text-align:center;
    font-size:9px;
    letter-spacing:0.16em;
    color:var(--muted);
    padding-bottom:0;
    opacity:0;
    transform:translateY(4px);
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .envelope:hover .hint{ opacity:0.8; transform:translateY(0); }

  /* ---------- Letter modal ---------- */
  .letter-overlay{
    position:fixed; inset:0;
    background:rgba(4,9,20,0.86);
    display:flex; align-items:center; justify-content:center;
    z-index:60;
    opacity:0; visibility:hidden;
    transition:opacity 0.35s ease;
    padding:24px;
  }
  .letter-overlay.active{ opacity:1; visibility:visible; }

  .letter-paper{
    position:relative;
    background:linear-gradient(178deg, #fbf4e6 0%, #f2e6c9 100%);
    border-radius:3px;
    padding:44px 34px 34px;
    max-width:360px;
    width:100%;
    text-align:center;
    transform-origin:top center;
    transform:scaleY(0.06);
    opacity:0;
    transition:transform 0.6s cubic-bezier(.32,.9,.28,1), opacity 0.25s ease;
    box-shadow:0 36px 80px rgba(2,6,15,0.5), 0 1px 0 rgba(255,255,255,0.4) inset;
  }
  .letter-overlay.active .letter-paper{
    transform:scaleY(1);
    opacity:1;
  }
  .letter-paper::before{
    content:"";
    position:absolute;
    left:6%; right:6%; top:50%;
    height:1px;
    background:rgba(122,90,45,0.14);
  }
  .letter-content{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.4s ease 0.35s, transform 0.4s ease 0.35s;
  }
  .letter-overlay.active .letter-content{
    opacity:1;
    transform:translateY(0);
  }
  .letter-ornament{
    font-size:15px;
    color:#a8824a;
    margin-bottom:14px;
    letter-spacing:0.3em;
  }
  .letter-from{
    font-size:10px;
    color:#9a7f57;
    margin-bottom:10px;
  }
  .letter-title{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:27px;
    color:#5c4324;
    margin-bottom:8px;
  }
  .letter-rule{
    width:30px; height:1px;
    background:rgba(122,90,45,0.3);
    margin:0 auto 22px;
  }
  .letter-body{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-size:19px;
    line-height:1.8;
    color:#4a3826;
    min-height:24px;
    margin-bottom:30px;
    white-space:pre-line;
  }
  .btn-close-letter{
    min-width:140px;
    color:#6b4f28;
    border-color:rgba(122,90,45,0.3);
  }
  .btn-close-letter:hover{ color:#3f2c14; border-color:#8a6a3a; background:rgba(122,90,45,0.06); }
</style>
</head>
<body>

<div class="sky"></div>
<div class="fireworks-bg" id="fireworks-bg"></div>
<div class="stars" id="stars"></div>

<!-- Screen 1: question -->
<section class="screen active" id="screen-question">
  <svg class="vine vine-left" id="vine-left" viewBox="0 0 200 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
  <svg class="vine vine-right" id="vine-right" viewBox="0 0 200 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="frame">
    <div class="rule top"></div>
    <h1 class="question">ты <em>лиза</em>?</h1>
    <div class="btn-row">
      <button class="btn-yes" id="btn-yes">да</button>
      <button class="btn-no" id="btn-no">нет</button>
    </div>
    <div class="rule bottom"></div>
  </div>
</section>

<!-- Screen 2: balloons rising -->
<section class="screen" id="screen-balloons">
  <div id="balloon-field"></div>
</section>

<!-- Screen 3: birthday -->
<section class="screen" id="screen-birthday">
  <div class="frame">
    <div class="rule top"></div>
    <h1 class="headline">с днём рождения, <span class="accent">Лиза</span></h1>

    <div class="letters-wrap">
      <div class="mono letters-label">письма для тебя</div>
      <div class="letters-grid">
        <div class="envelope" data-letter="vova">
          <div class="flap"></div>
          <div class="seal"></div>
          <div class="name">Вовчик</div>
          <div class="mono hint">открыть</div>
        </div>
        <div class="envelope" data-letter="masha">
          <div class="flap"></div>
          <div class="seal"></div>
          <div class="name">Маша</div>
          <div class="mono hint">открыть</div>
        </div>
        <div class="envelope" data-letter="liza">
          <div class="flap"></div>
          <div class="seal"></div>
          <div class="name">Лиза</div>
          <div class="mono hint">открыть</div>
        </div>
      </div>
    </div>

    <div class="rule bottom"></div>
  </div>
</section>

<!-- Letter modal -->
<div class="letter-overlay" id="letter-overlay">
  <div class="letter-paper">
    <div class="letter-content">
      <div class="letter-ornament">✦</div>
      <div class="mono letter-from" id="letter-from"></div>
      <div class="letter-title" id="letter-title"></div>
      <div class="letter-rule"></div>
      <div class="letter-body" id="letter-body"></div>
      <button class="btn-close-letter" id="btn-close-letter">закрыть</button>
    </div>
  </div>
</div>

<!-- Modal for "Нет" -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <p>кажется, произошла ошибка —<br>перезагрузите страницу</p>
    <button class="btn-reload" id="btn-reload">перезагрузить</button>
  </div>
</div>

<script>
  // --- background stars ---
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 50;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*4) + 's';
    s.style.width = s.style.height = (Math.random()*1.4+1) + 'px';
    starsContainer.appendChild(s);
  }

  // --- decorative vines (hairline, minimal) ---
  function buildVine(svgId){
    const svg = document.getElementById(svgId);
    const W = 200, H = 900;
    const centerX = 60;
    const amplitude = 32;
    const wavelength = 170;
    const step = 14;

    let path = `M ${centerX} 0`;
    const points = [];
    for(let y = 0; y <= H; y += step){
      const x = centerX + amplitude * Math.sin(y / wavelength * Math.PI * 2);
      path += ` L ${x.toFixed(1)} ${y}`;
      points.push({x, y});
    }

    let svgMarkup = `<path d="${path}" fill="none" stroke="#8fd3f4" stroke-opacity="0.35" stroke-width="1"/>`;

    points.forEach((p, i) => {
      if(i % 4 !== 0 || i === 0) return;
      const side = (i % 8 === 0) ? 1 : -1;
      const len = 16 + (i % 5) * 2;
      const x2 = p.x + side * len;
      const y2 = p.y - len * 0.55;
      svgMarkup += `<line x1="${p.x}" y1="${p.y}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#a9bdf5" stroke-opacity="0.3" stroke-width="0.8"/>`;
      svgMarkup += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2" fill="#8fd3f4" fill-opacity="0.4"/>`;
    });

    points.forEach((p, i) => {
      if(i % 11 !== 0) return;
      svgMarkup += `<circle cx="${p.x}" cy="${p.y}" r="1.6" fill="#e8c98a" fill-opacity="0.4"/>`;
    });

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = svgMarkup;
  }
  buildVine('vine-left');
  buildVine('vine-right');

  // --- static firework bursts on background ---
  function buildFirework(cx, cy, radius, color, rayCount, delay){
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const size = radius * 2.6;
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
    svg.classList.add('firework');
    svg.style.left = `calc(${cx}% - ${size/2}px)`;
    svg.style.top = `calc(${cy}% - ${size/2}px)`;
    svg.style.animationDelay = delay + 's';

    const c = size/2;
    let markup = `<circle cx="${c}" cy="${c}" r="2.4" fill="${color}" fill-opacity="0.9"/>`;

    for(let i=0;i<rayCount;i++){
      const angle = (i / rayCount) * Math.PI * 2;
      const len = radius * (0.65 + Math.random()*0.35);
      const x2 = c + Math.cos(angle) * len;
      const y2 = c + Math.sin(angle) * len;
      const xMid = c + Math.cos(angle) * len * 0.55;
      const yMid = c + Math.sin(angle) * len * 0.55;

      markup += `<line x1="${c}" y1="${c}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round"/>`;
      markup += `<circle cx="${xMid.toFixed(1)}" cy="${yMid.toFixed(1)}" r="1" fill="${color}" fill-opacity="0.5"/>`;
      markup += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="1.6" fill="${color}" fill-opacity="0.85"/>`;
    }

    svg.innerHTML = markup;
    return svg;
  }

  function buildFireworksField(){
    const field = document.getElementById('fireworks-bg');
    const fireworks = [
      { cx: 14, cy: 20, radius: 46, color: '#8fd3f4', rays: 14, delay: 0 },
      { cx: 85, cy: 16, radius: 34, color: '#a9bdf5', rays: 12, delay: 1.4 },
      { cx: 90, cy: 62, radius: 40, color: '#e8c98a', rays: 13, delay: 2.6 },
      { cx: 10, cy: 74, radius: 30, color: '#e79fc4', rays: 11, delay: 0.8 },
      { cx: 50, cy: 10, radius: 26, color: '#a692e0', rays: 10, delay: 3.2 }
    ];
    fireworks.forEach(f => {
      field.appendChild(buildFirework(f.cx, f.cy, f.radius, f.color, f.rays, f.delay));
    });
  }
  buildFireworksField();

  const screenQuestion = document.getElementById('screen-question');
  const screenBalloons = document.getElementById('screen-balloons');
  const screenBirthday = document.getElementById('screen-birthday');
  const modalOverlay = document.getElementById('modal-overlay');

  function showScreen(el){
    [screenQuestion, screenBalloons, screenBirthday].forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  document.getElementById('btn-no').addEventListener('click', () => {
    modalOverlay.classList.add('active');
  });
  document.getElementById('btn-reload').addEventListener('click', () => {
    location.reload();
  });

  const balloonColors = ['#8fd3f4', '#a9bdf5', '#e8c98a', '#e79fc4', '#a692e0', '#a9e8ff'];

  function launchBalloons(){
    const field = document.getElementById('balloon-field');
    field.innerHTML = '';
    const count = 42;
    for(let i=0;i<count;i++){
      const b = document.createElement('div');
      b.className = 'balloon';
      const size = 40 + Math.random()*36;
      const left = Math.random()*94;
      const delay = Math.random()*0.9;
      const duration = 2.3 + Math.random()*1.3;
      const drift = (Math.random()*80 - 40) + 'px';
      const rot = (Math.random()*16 - 8) + 'deg';
      const color = balloonColors[Math.floor(Math.random()*balloonColors.length)];

      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = left + 'vw';
      b.style.background = `radial-gradient(circle at 35% 30%, ${color}, ${color}cc 60%, ${color}88 100%)`;
      b.style.setProperty('--drift', drift);
      b.style.setProperty('--rot', rot);
      b.style.animation = `rise ${duration}s ease-out ${delay}s forwards`;

      field.appendChild(b);
    }
  }

  document.getElementById('btn-yes').addEventListener('click', () => {
    showScreen(screenBalloons);
    launchBalloons();
    setTimeout(() => {
      showScreen(screenBirthday);
      addFloatingBalloons();
    }, 3000);
  });

  function addFloatingBalloons(){
    const host = screenBirthday;
    if(host.querySelector('.float-balloon')) return;
    const positions = [
      {left:'8%', top:'16%', size:26, color:'#8fd3f4'},
      {left:'88%', top:'22%', size:20, color:'#e8c98a'},
      {left:'12%', top:'76%', size:18, color:'#e79fc4'},
      {left:'90%', top:'70%', size:22, color:'#a692e0'}
    ];
    positions.forEach((p, idx) => {
      const b = document.createElement('div');
      b.className = 'float-balloon';
      b.style.left = p.left;
      b.style.top = p.top;
      b.style.width = p.size + 'px';
      b.style.height = p.size + 'px';
      b.style.background = `radial-gradient(circle at 35% 30%, ${p.color}, ${p.color}cc 60%, ${p.color}88 100%)`;
      b.style.animationDelay = (idx*0.6) + 's';
      host.appendChild(b);
    });
  }

  // --- letters ---
  const letters = {
    vova:  { title: 'от вовчика', text: 'текст' },
    masha: { title: 'от маши',    text: 'текст' },
    liza:  { title: 'от лизы',    text: 'Лиза, поздравляю тебя с днём рождения! Желаю, чтобы этот день для тебя был самым светлым и счастливым. Возможно, все получается не так, как ты планировала и хотела но мы — твои друзья, сделаем этот день счастливым и значимым для тебя, ведь это твой день🥹🥹🥹' }
  };

  const letterOverlay = document.getElementById('letter-overlay');
  const letterFrom = document.getElementById('letter-from');
  const letterTitle = document.getElementById('letter-title');
  const letterBody = document.getElementById('letter-body');

  function openLetter(key){
    const data = letters[key];
    if(!data) return;
    letterFrom.textContent = 'письмо';
    letterTitle.textContent = data.title;
    letterBody.textContent = data.text;
    letterOverlay.classList.add('active');
  }

  function closeLetter(){
    letterOverlay.classList.remove('active');
  }

  document.querySelectorAll('.envelope').forEach(env => {
    env.addEventListener('click', () => {
      openLetter(env.getAttribute('data-letter'));
    });
  });

  document.getElementById('btn-close-letter').addEventListener('click', closeLetter);
  letterOverlay.addEventListener('click', (e) => {
    if(e.target === letterOverlay) closeLetter();
  });
</script>

</body>
</html>
